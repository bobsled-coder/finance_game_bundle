name: finance_game_bundle

x-go-source-context: &go-source-context ${GO_SOURCE:-ssh://git@github.com/bobsled-coder/finance_game_go.git#58b79b94886713ce0912cfda01aa2943ec7483a1}
x-ui-source-context: &ui-source-context ${UI_SOURCE:-ssh://git@github.com/bobsled-coder/finance_game_ui.git#649ddf704ab06a530471def66316fa60b44e8887}
x-release-labels: &release-labels
  org.financegame.release.id: ${RELEASE_ID:-finance-game-2026-10-candidate-1}
  org.financegame.release.pair-sha256: ${RELEASE_PAIR_SHA256:-unresolved}
  org.financegame.release.qualification: ${RELEASE_QUALIFICATION:-candidate}

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: financegame
      POSTGRES_USER: financegame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financegame_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financegame -d financegame"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  migrate:
    build:
      context: *go-source-context
      target: migrate
      labels:
        <<: *release-labels
        org.financegame.source.role: migration
        org.financegame.source.revision: ${GO_SOURCE_REVISION:-58b79b94886713ce0912cfda01aa2943ec7483a1}
    labels:
      <<: *release-labels
      org.financegame.source.role: migration
      org.financegame.source.repository: https://github.com/bobsled-coder/finance_game_go.git
      org.financegame.source.revision: ${GO_SOURCE_REVISION:-58b79b94886713ce0912cfda01aa2943ec7483a1}
    environment: &postgres_client_env
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: financegame
      PGUSER: financegame
      PGPASSWORD: ${POSTGRES_PASSWORD:-financegame_local_dev}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: *go-source-context
      target: api
      labels:
        <<: *release-labels
        org.financegame.source.role: api
        org.financegame.source.revision: ${GO_SOURCE_REVISION:-58b79b94886713ce0912cfda01aa2943ec7483a1}
    environment:
      <<: *postgres_client_env
      HTTP_ADDR: ":8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    labels:
      <<: *release-labels
      org.financegame.source.role: api
      org.financegame.source.repository: https://github.com/bobsled-coder/finance_game_go.git
      org.financegame.source.revision: ${GO_SOURCE_REVISION:-58b79b94886713ce0912cfda01aa2943ec7483a1}
    restart: unless-stopped

  ui:
    build:
      context: *ui-source-context
      labels:
        <<: *release-labels
        org.financegame.source.role: ui
        org.financegame.source.revision: ${UI_SOURCE_REVISION:-649ddf704ab06a530471def66316fa60b44e8887}
    depends_on:
      api:
        condition: service_started
        restart: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live && wget -q -O /dev/null http://api:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]
    labels:
      <<: *release-labels
      org.financegame.source.role: ui
      org.financegame.source.repository: https://github.com/bobsled-coder/finance_game_ui.git
      org.financegame.source.revision: ${UI_SOURCE_REVISION:-649ddf704ab06a530471def66316fa60b44e8887}
    restart: unless-stopped

networks:
  backend:

volumes:
  postgres_data:
