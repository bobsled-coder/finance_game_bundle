name: finance_game_bundle

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: financegame
      POSTGRES_USER: financegame
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financegame_local_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financegame -d financegame"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  migrate:
    build:
      context: ${GO_SOURCE:-ssh://git@github.com/bobsled-coder/finance_game_go.git#main}
      target: migrate
    environment: &postgres_client_env
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: financegame
      PGUSER: financegame
      PGPASSWORD: ${POSTGRES_PASSWORD:-financegame_local_dev}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    build:
      context: ${GO_SOURCE:-ssh://git@github.com/bobsled-coder/finance_game_go.git#main}
      target: api
    environment:
      <<: *postgres_client_env
      HTTP_ADDR: ":8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped

  ui:
    build:
      context: ${UI_SOURCE:-ssh://git@github.com/bobsled-coder/finance_game_ui.git#main}
    depends_on:
      api:
        condition: service_started
        restart: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live && wget -q -O /dev/null http://api:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]
    restart: unless-stopped

networks:
  backend:

volumes:
  postgres_data:
